<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Договор рассрочки — обучение</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"DejaVu Sans",Arial,sans-serif;color:#23322f;background:#eef4f0}
header{height:132px;background:#fff;border-bottom:3px solid #23634e;display:flex;align-items:center;padding:24px 44px;gap:24px;position:relative;z-index:5}
#step{width:72px;height:72px;flex-shrink:0;display:grid;place-items:center;background:#23634e;color:#fff;font-size:38px;border-radius:20px}
h1{font-size:31px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.5px}#subtitle{font-size:22px;line-height:1.3;color:#5b6b63}#example{position:absolute;right:32px;top:12px;font-size:11px;letter-spacing:1px;color:#849089}
#stage{position:absolute;left:0;top:132px;width:1920px;height:876px;overflow:hidden;background:#edf5ef}#app{position:absolute;width:1600px;height:1000px;border:0;transform-origin:0 0;transition:transform 1000ms cubic-bezier(.35,0,.2,1);background:#eef2ef}
footer{height:72px;position:absolute;bottom:0;left:0;width:1920px;background:#fff;border-top:1px solid #e1e8e3;display:flex;align-items:center;justify-content:center;gap:22px;font-size:19px;color:#728178;z-index:6}footer span{padding:11px 17px;border-radius:10px}footer span.active{background:#23634e;color:#fff}footer i{font-style:normal;color:#a5aea8}
#cursor{position:absolute;left:0;top:0;z-index:20;pointer-events:none;width:37px;height:49px;filter:drop-shadow(1px 3px 3px #0005);transition:left 650ms ease-in-out,top 650ms ease-in-out;display:none}
#click{position:absolute;z-index:19;pointer-events:none;width:54px;height:54px;border:4px solid #e38b38;background:#ffcd6a55;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}#click.go{animation:pulse .6s ease-out}@keyframes pulse{0%{opacity:1;scale:.45}70%{opacity:.8}100%{opacity:0;scale:1.25}}
</style></head><body>
<header><div id="step">0</div><div><h1 id="title">Настройте город и год</h1><div id="subtitle">Только один раз. Если понадобится изменить — повторите шаг 0.</div></div><div id="example">УЧЕБНЫЙ ПРИМЕР · ДАННЫЕ ВЫМЫШЛЕННЫЕ</div></header>
<div id="stage"><iframe id="app" src="/app" title="Договор рассрочки"></iframe></div>
<footer><span data-step="0">0. Город и год</span><i>→</i><span data-step="1">1. Информация о рассрочке</span><i>→</i><span data-step="2">2. Данные</span><i>→</i><span data-step="3">3. Проверка</span><i>→</i><span data-step="4">4. Скачивание</span></footer>
<div id="click"></div>
<svg id="cursor" viewBox="0 0 37 49" xmlns="http://www.w3.org/2000/svg"><path d="M3 3 L3 37 L12 29 L20 45 L27 41 L19 26 L33 26 Z" fill="#183f32" stroke="white" stroke-width="3" stroke-linejoin="round"/></svg>
<script>
window.lesson={
 title(step,title,subtitle){document.querySelector('#step').textContent=step;document.querySelector('#title').textContent=title;document.querySelector('#subtitle').textContent=subtitle;document.querySelectorAll('[data-step]').forEach(n=>n.classList.toggle('active',n.dataset.step===String(step)))},
 camera(scale,x,y,instant=false){const n=document.querySelector('#app');n.style.transitionDuration=instant?'0ms':'1000ms';n.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.querySelector('#cursor').style.display='none'},
 cursor(x,y,instant=false){const n=document.querySelector('#cursor');n.style.transitionDuration=instant?'0ms':'650ms';n.style.left=(x-3)+'px';n.style.top=(y-3)+'px';n.style.display='block'},
 click(x,y){const n=document.querySelector('#click');n.style.left=x+'px';n.style.top=y+'px';n.classList.remove('go');void n.offsetWidth;n.classList.add('go')}
};window.lesson.title(0,'Настройте город и год','Только один раз. Если понадобится изменить — повторите шаг 0.');
</script></body></html>
